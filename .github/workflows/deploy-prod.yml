name: Deploy to AWS Production Environment

on:
  push:
    branches:
      - production
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".dockerignore"
  workflow_dispatch: # Allow manual trigger

env:
  AWS_REGION: us-east-1
  TERRAFORM_DIR: infra/terraform/environments/prod

jobs:
  # ============================================
  # Require Manual Approval for Production
  # ============================================
  approval:
    name: Production Deployment Approval
    runs-on: ubuntu-latest
    environment: production # Requires GitHub environment protection rules
    steps:
      - name: Approve production deployment
        run: echo "Production deployment approved"

  deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest
    needs: approval

    permissions:
      id-token: write
      contents: read

    steps:
      # ============================================
      # 1. Checkout Code
      # ============================================
      - name: Checkout code
        uses: actions/checkout@v4

      # ============================================
      # 2. Configure AWS Credentials
      # ============================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ============================================
      # 3. Setup Terraform
      # ============================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          terraform_wrapper: false

      # ============================================
      # 4. Get Infrastructure Outputs
      # ============================================
      - name: Get Terraform outputs
        id: tf_outputs
        working-directory: ${{ env.TERRAFORM_DIR }}
        run: |
          terraform init
          echo "backend_ecr=$(terraform output -raw backend_ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "frontend_ecr=$(terraform output -raw frontend_ecr_repository_url)" >> $GITHUB_OUTPUT
          echo "cluster=$(terraform output -raw ecs_cluster_name)" >> $GITHUB_OUTPUT
          echo "alb_dns=$(terraform output -raw alb_dns_name)" >> $GITHUB_OUTPUT

      # ============================================
      # 5. Login to Amazon ECR
      # ============================================
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 6. Build and Push Backend Image
      # ============================================
      - name: Build, tag, and push backend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.tf_outputs.outputs.backend_ecr }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
          echo "Backend image pushed: $ECR_REPOSITORY:$IMAGE_TAG"

      # ============================================
      # 7. Build and Push Frontend Image
      # ============================================
      - name: Build, tag, and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ steps.tf_outputs.outputs.frontend_ecr }}
          IMAGE_TAG: ${{ github.sha }}
          VITE_API_URL: http://${{ steps.tf_outputs.outputs.alb_dns }}
        run: |
          cd frontend
          docker build --build-arg VITE_API_URL=$VITE_API_URL -t $ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REPOSITORY:$IMAGE_TAG $ECR_REPOSITORY:latest
          docker push $ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REPOSITORY:latest
          echo "Frontend image pushed: $ECR_REPOSITORY:$IMAGE_TAG"

      # ============================================
      # 8. Deploy Backend to ECS (Blue/Green)
      # ============================================
      - name: Deploy backend to ECS
        env:
          CLUSTER: ${{ steps.tf_outputs.outputs.cluster }}
        run: |
          echo "Deploying backend service..."
          aws ecs update-service \
            --cluster $CLUSTER \
            --service cloudforge-prod-backend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for backend deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services cloudforge-prod-backend-service \
            --region ${{ env.AWS_REGION }}

          echo "✅ Backend deployed successfully"

      # ============================================
      # 9. Deploy Frontend to ECS
      # ============================================
      - name: Deploy frontend to ECS
        env:
          CLUSTER: ${{ steps.tf_outputs.outputs.cluster }}
        run: |
          echo "Deploying frontend service..."
          aws ecs update-service \
            --cluster $CLUSTER \
            --service cloudforge-prod-frontend-service \
            --force-new-deployment \
            --region ${{ env.AWS_REGION }}

          echo "Waiting for frontend deployment to stabilize..."
          aws ecs wait services-stable \
            --cluster $CLUSTER \
            --services cloudforge-prod-frontend-service \
            --region ${{ env.AWS_REGION }}

          echo "✅ Frontend deployed successfully"

      # ============================================
      # 10. Health Check
      # ============================================
      - name: Verify deployment health
        env:
          ALB_DNS: ${{ steps.tf_outputs.outputs.alb_dns }}
        run: |
          echo "Performing health check..."

          # Check backend health
          for i in {1..5}; do
            if curl -f http://$ALB_DNS/api/health; then
              echo "✅ Backend health check passed"
              break
            fi
            echo "Retrying health check... ($i/5)"
            sleep 10
          done

          # Check frontend
          if curl -f http://$ALB_DNS; then
            echo "✅ Frontend health check passed"
          else
            echo "⚠️ Frontend health check failed"
            exit 1
          fi

      # ============================================
      # 11. Deployment Summary
      # ============================================
      - name: Deployment summary
        env:
          ALB_DNS: ${{ steps.tf_outputs.outputs.alb_dns }}
        run: |
          echo "========================================="
          echo "🚀 Production Deployment Complete!"
          echo "========================================="
          echo ""
          echo "Application URL: http://$ALB_DNS"
          echo "Commit SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Deployed by: ${{ github.actor }}"
          echo ""
          echo "Backend Image: ${{ steps.tf_outputs.outputs.backend_ecr }}:${{ github.sha }}"
          echo "Frontend Image: ${{ steps.tf_outputs.outputs.frontend_ecr }}:${{ github.sha }}"
          echo ""
          echo "========================================="

      # ============================================
      # 12. Notify on Failure
      # ============================================
      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Please check the logs and rollback if necessary"
